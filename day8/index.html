
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Desk UI - Day 8</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Stock Desk Inventory System</h1>

    <!-- Form Section -->
    <form id="stock-form" onsubmit="event.preventDefault();">
      <fieldset>
        <legend>Manage Stock Operations</legend>

        <div class="form-group">
          <label for="product-select">Select Product:</label>
          <select id="product-select">
            <option value="Notebook">Notebook</option>
            <option value="Eraser">Eraser</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity-input">Quantity:</label>
          <input type="number" id="quantity-input" min="1" step="1" placeholder="Enter quantity" required>
        </div>

        <div class="actions">
          <button type="button" id="sell-btn">Sell</button>
          <button type="button" id="restock-btn">Restock</button>
          <button type="button" id="return-btn">Return</button>
        </div>
      </fieldset>
    </form>

    <!-- Result / Status Message -->
    <div id="result" role="status" aria-live="polite" class="message-box">
      Select a product and action to start.
    </div>

    <!-- Inventory Table -->
    <div class="table-wrapper">
      <table>
        <caption>Current Inventory Status</caption>
        <thead>
          <tr>
            <th>Product</th>
            <th>Price ($)</th>
            <th>Stock</th>
            <th>Net Sold</th>
            <th>Net Sales ($)</th>
            <th>Restocked</th>
            <th>Inventory Value ($)</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody">
          <!-- Rows rendered dynamically via app.js -->
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
