<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Desk UI - Day 9 Checkpoint</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Stock Desk UI</h1>
        
        <!-- Table with Semantic Caption -->
        <table>
            <caption>Current Product Inventory and Sales Summary</caption>
            <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Price</th>
                    <th scope="col">Stock</th>
                    <th scope="col">Sold</th>
                    <th scope="col">Sales</th>
                    <th scope="col">Restocked</th>
                    <th scope="col">Inventory</th>
                </tr>
            </thead>
            <tbody>
                <tr id="row-Notebook">
                    <td>Notebook</td>
                    <td id="price-Notebook">6</td>
                    <td id="stock-Notebook">5</td>
                    <td id="sold-Notebook">0</td>
                    <td id="sales-Notebook">0</td>
                    <td id="restocked-Notebook">0</td>
                    <td id="inventory-Notebook">30</td>
                </tr>
                <tr id="row-Eraser">
                    <td>Eraser</td>
                    <td id="price-Eraser">2</td>
                    <td id="stock-Eraser">3</td>
                    <td id="sold-Eraser">0</td>
                    <td id="sales-Eraser">0</td>
                    <td id="restocked-Eraser">0</td>
                    <td id="inventory-Eraser">6</td>
                </tr>
            </tbody>
        </table>

        <!-- Controls Form with Accessibility Attributes -->
        <form class="controls-section" id="stockForm" onsubmit="return false;">
            <label for="productSelect">Select Product:</label>
            <select id="productSelect">
                <option value="Notebook">Notebook</option>
                <option value="Eraser">Eraser</option>
            </select>

            <label for="quantityInput">Quantity:</label>
            <input 
                type="number" 
                id="quantityInput" 
                placeholder="Enter quantity (1-1000)"
                aria-describedby="messageBox"
                aria-invalid="false"
            >

            <div class="button-group">
                <button type="button" id="sellBtn">Sell</button>
                <button type="button" id="restockBtn">Restock</button>
                <button type="button" id="returnBtn">Return</button>
            </div>

            <div id="messageBox" class="message-box" aria-live="polite"></div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
